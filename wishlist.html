<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist &mdash; Raven &amp; Ridge Outfitters</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Gear you've saved for later at Raven &amp; Ridge Outfitters.">
<meta property="og:title" content="Your Wishlist &mdash; Raven &amp; Ridge Outfitters">
<meta property="og:description" content="Gear you've saved for later at Raven &amp; Ridge Outfitters.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="cart.css">
</head>
<body>

<script src="header.js" data-base="."></script>

<section>
  <h1>Your Wishlist</h1>
  <p class="section-sub">Gear you've saved for later. Nothing here is reserved &mdash; move it to your cart when you're ready.</p>

  <div id="wishlist-empty" class="cart-empty" style="display:none;">
    <p>You haven't saved anything yet.</p>
    <a class="btn" href="index.html#shop">Browse the Flock Collection</a>
  </div>

  <div id="wishlist-items" class="cart-items"></div>

  <div class="contact-note">Saving gear for a gift, or thinking about a bulk order? Email <a href="mailto:hello@ravenandridge.example">hello@ravenandridge.example</a> and we'll help you plan it out.</div>
</section>

<script src="footer.js" data-base="."></script>

<script src="cart.js"></script>
<script src="wishlist.js"></script>
<script>
(function () {
  function render() {
    var list = window.RavenWishlist.getList();
    var itemsEl = document.getElementById('wishlist-items');
    var emptyEl = document.getElementById('wishlist-empty');

    itemsEl.innerHTML = '';

    if (list.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    list.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'cart-item wishlist-item';
      row.innerHTML =
        '<div class="cart-item-icon">' + item.icon + '</div>' +
        '<div class="cart-item-info"><h3>' + item.name + '</h3><div class="cart-item-price">' + window.RavenCart.formatPrice(item.price) + '</div></div>' +
        '<button class="btn wishlist-move-to-cart" type="button" data-id="' + item.id + '" data-name="' + item.name + '" data-price="' + item.price + '" data-icon="' + item.icon + '" aria-label="Move ' + item.name + ' to cart">Move to cart</button>' +
        '<button class="cart-remove" type="button" data-id="' + item.id + '" aria-label="Remove ' + item.name + ' from wishlist">&times;</button>';
      itemsEl.appendChild(row);
    });
  }

  document.addEventListener('click', function (e) {
    if (e.target.matches('.cart-remove')) {
      window.RavenWishlist.removeFromWishlist(e.target.getAttribute('data-id'));
      render();
    }
    if (e.target.matches('.wishlist-move-to-cart')) {
      window.RavenCart.addToCart({
        id: e.target.getAttribute('data-id'),
        name: e.target.getAttribute('data-name'),
        price: parseFloat(e.target.getAttribute('data-price')),
        icon: e.target.getAttribute('data-icon')
      }, 1);
      window.RavenWishlist.removeFromWishlist(e.target.getAttribute('data-id'));
      render();
    }
  });

  document.addEventListener('DOMContentLoaded', render);
})();
</script>

</body>
</html>
